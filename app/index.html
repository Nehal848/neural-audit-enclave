<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital AI Ecosystem | On-Premise Healthcare Platform</title>
<meta name="description" content="On-premise AI-powered healthcare platform for disease prediction, report analysis, and medical AI model management for hospitals and doctors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Premier Design Tokens & Blue/Grey/Beige Gradients ──────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: linear-gradient(135deg, #EFF4FB 0%, #E4EAEE 45%, #ECE8E1 100%);
  --surface: rgba(255, 255, 255, 0.88);
  --surface-hover: rgba(255, 255, 255, 0.98);
  --surface-glass: rgba(255, 255, 255, 0.72);
  --surface2: #EEF2F8;
  --surface3: #E3E9F3;
  --border: rgba(100, 116, 139, 0.18);
  --border-strong: rgba(100, 116, 139, 0.35);
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --primary-mid: #3B82F6;
  --primary-gradient: linear-gradient(135deg, #1E40AF 0%, #2563EB 50%, #3B82F6 100%);
  --accent: #64748B;
  --accent-light: #F1F5F9;
  --beige: #F5F2EC;
  --beige-dark: #E5DFC8;
  --beige-card: linear-gradient(135deg, #F8F6F0 0%, #EFECE4 100%);
  --text: #0F172A;
  --textmuted: #475569;
  --textsub: #94A3B8;
  --emerald: #059669;
  --emerald-light: #ECFDF5;
  --rose: #E11D48;
  --rose-light: #FFF1F2;
  --amber: #D97706;
  --amber-light: #FFFBEB;
  --sky: #0284C7;
  --sky-light: #F0F9FF;
  --sidebar-w: 260px;
  --header-h: 66px;
}
body{
  background: var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.mono{font-family: 'JetBrains Mono', monospace}
.heading-font{font-family: 'Outfit', 'Inter', sans-serif}

/* ── Scrollbar ─── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,0.3);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,0.5)}

/* ── Utilities ─── */
.hidden{display:none!important}
.flex{display:flex}.items-center{align-items:center}.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-grow{flex-grow:1}.flex-wrap{flex-wrap:wrap}
.w-full{width:100%}.shrink-0{flex-shrink:0}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}.gap-8{gap:32px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.p-3{padding:12px}.p-4{padding:16px}.p-5{padding:20px}.p-6{padding:26px}
.px-4{padding-left:16px;padding-right:16px}.py-3{padding-top:12px;padding-bottom:12px}
.rounded{border-radius:8px}.rounded-lg{border-radius:12px}.rounded-xl{border-radius:18px}.rounded-full{border-radius:9999px}
.border-b{border-bottom:1px solid var(--border)}
.text-center{text-align:center}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-xs{font-size:11px}.text-sm{font-size:13px}.text-base{font-size:15px}
.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:26px}.text-3xl{font-size:34px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-black{font-weight:900}
.text-primary{color:var(--primary)}.text-muted{color:var(--textmuted)}.text-sub{color:var(--textsub)}
.text-emerald{color:var(--emerald)}.text-amber{color:var(--amber)}.text-rose{color:var(--rose)}.text-sky{color:var(--sky)}
.fade-in{animation:fadeIn 0.32s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Cards & Glassmorphism ─── */
.card{
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow: 0 10px 30px rgba(30, 41, 59, 0.05), 0 1px 3px rgba(30, 41, 59, 0.03);
  border-radius: 18px;
  padding: 22px;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover{
  box-shadow: 0 16px 40px rgba(30, 41, 59, 0.09);
  transform: translateY(-2px);
}
.card-sm{
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 4px 15px rgba(30, 41, 59, 0.04);
  border-radius: 14px;
  padding: 16px;
}
.card-beige{
  background: var(--beige-card);
  border: 1px solid var(--beige-dark);
  box-shadow: 0 6px 20px rgba(120, 110, 90, 0.06);
  border-radius: 16px;
  padding: 20px;
}
.card-primary{
  background: var(--primary-gradient);
  border-radius: 18px;
  padding: 22px;
  color: #fff;
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.28);
}

/* ── Buttons ─── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;border-radius:12px;font-weight:600;font-size:13px;
  cursor:pointer;border:none;transition:all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  font-family:'Inter',sans-serif;
}
.btn-primary{
  background: var(--primary-gradient);
  color:#fff;
  box-shadow:0 4px 12px rgba(37, 99, 235, 0.25);
}
.btn-primary:hover{
  opacity:0.95;transform:translateY(-1.5px);
  box-shadow:0 6px 18px rgba(37, 99, 235, 0.35);
}
.btn-ghost{background:transparent;color:var(--textmuted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-outline{background:var(--primary-light);color:var(--primary);border:1px solid rgba(37,99,235,0.22)}
.btn-outline:hover{background:rgba(37,99,235,0.14)}
.btn-danger{background:var(--rose-light);color:var(--rose);border:1px solid rgba(225,29,72,0.22)}
.btn-danger:hover{background:rgba(225,29,72,0.15)}
.btn-success{background:var(--emerald-light);color:var(--emerald);border:1px solid rgba(5,150,105,0.22)}
.btn-success:hover{background:rgba(5,150,105,0.15)}
.btn-amber{background:var(--amber-light);color:var(--amber);border:1px solid rgba(217,119,6,0.22)}
.btn-amber:hover{background:rgba(217,119,6,0.15)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}
.btn-lg{padding:13px 30px;font-size:15px;border-radius:14px}

/* ── Badges ─── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:0.3px}
.badge-primary{background:var(--primary-light);color:var(--primary);border:1px solid rgba(37,99,235,0.18)}
.badge-emerald{background:var(--emerald-light);color:var(--emerald);border:1px solid rgba(5,150,105,0.18)}
.badge-rose{background:var(--rose-light);color:var(--rose);border:1px solid rgba(225,29,72,0.18)}
.badge-amber{background:var(--amber-light);color:var(--amber);border:1px solid rgba(217,119,6,0.18)}
.badge-sky{background:var(--sky-light);color:var(--sky);border:1px solid rgba(2,132,199,0.18)}
.badge-slate{background:var(--accent-light);color:var(--accent);border:1px solid var(--border)}

/* ── Status dots ─── */
.dot-active{width:8px;height:8px;border-radius:50%;background:var(--emerald);display:inline-block;box-shadow:0 0 8px var(--emerald)}
.dot-warn{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;box-shadow:0 0 8px var(--amber)}
.dot-off{width:8px;height:8px;border-radius:50%;background:var(--rose);display:inline-block}

/* ── Layout & Header ─── */
header{
  height:var(--header-h);background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  box-shadow: 0 4px 20px rgba(30,41,59,0.03);
}
.header-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none}
.header-logo{width:36px;height:36px;border-radius:10px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:900;box-shadow:0 4px 10px rgba(37,99,235,0.3)}
.app-container{display:flex;min-height:calc(100vh - var(--header-h))}

/* ── Sidebar ─── */
aside{
  width:var(--sidebar-w);background:rgba(245,242,236,0.85);backdrop-filter:blur(16px);
  border-right:1px solid var(--beige-dark);display:flex;flex-direction:column;
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  flex-shrink:0;z-index:40;
}
.sidebar-section{padding:16px 14px 6px;font-size:11px;font-weight:700;color:var(--textsub);text-transform:uppercase;letter-spacing:0.06em}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 16px;margin:3px 10px;
  border-radius:12px;font-weight:600;font-size:13px;color:var(--textmuted);
  cursor:pointer;transition:all 0.18s;
}
.nav-item:hover{background:rgba(255,255,255,0.7);color:var(--text);transform:translateX(2px)}
.nav-item.active{background:var(--primary-gradient);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,0.25)}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.nav-item .subtext{font-size:11px;font-weight:500;opacity:0.8;display:block;margin-top:1px}

/* ── Main content area ─── */
main{flex-grow:1;padding:32px;max-width:1440px;margin:0 auto}
.page-header{margin-bottom:28px}
.page-title{font-size:26px;font-weight:800;color:var(--text);font-family:'Outfit',sans-serif;letter-spacing:-0.4px}
.page-sub{font-size:14px;color:var(--textmuted);margin-top:4px}
.section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ── Stat cards ─── */
.stat-card{background:var(--surface);border:1px solid rgba(255,255,255,0.7);box-shadow:0 6px 20px rgba(30,41,59,0.04);border-radius:16px;padding:20px}
.stat-label{font-size:12px;font-weight:600;color:var(--textmuted);text-transform:uppercase;letter-spacing:0.4px}
.stat-val{font-size:30px;font-weight:800;color:var(--text);margin-top:8px;font-family:'Outfit',sans-serif}
.stat-sub{font-size:12px;color:var(--textsub);margin-top:4px}

/* ── Alert bars ─── */
.alert-bar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:500;margin-bottom:16px}
.alert-primary{background:var(--primary-light);border:1px solid rgba(37,99,235,0.2);color:var(--primary-dark)}
.alert-success{background:var(--emerald-light);border:1px solid rgba(5,150,105,0.2);color:var(--emerald)}
.alert-danger{background:var(--rose-light);border:1px solid rgba(225,29,72,0.2);color:var(--rose)}
.alert-amber{background:var(--amber-light);border:1px solid rgba(217,119,6,0.2);color:var(--amber)}

/* ── Forms ─── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-input{
  width:100%;padding:11px 15px;background:#fff;border:1px solid var(--border-strong);
  border-radius:11px;font-size:14px;color:var(--text);outline:none;transition:all 0.18s;
  font-family:'Inter',sans-serif;
}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
select.form-input{cursor:pointer}

/* ── Tables ─── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:rgba(241,245,249,0.7);padding:12px 16px;text-align:left;font-weight:700;color:var(--textmuted);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border-strong)}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text)}
.data-table tr:hover td{background:rgba(255,255,255,0.5)}

/* ── Modals ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:0 25px 60px rgba(15,23,42,0.22);max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:20px;right:20px;background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--textmuted)}

/* ── Tab Bar ─── */
.tab-group{display:flex;gap:6px;background:rgba(255,255,255,0.7);padding:6px;border-radius:14px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--textmuted);cursor:pointer;transition:all 0.18s}
.tab-btn.active{background:var(--primary-gradient);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,0.22)}

/* ── Progress & Confidence Bars ─── */
.progress-bar{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;flex-grow:1}
.progress-fill{height:100%;background:var(--primary-gradient);border-radius:99px;transition:width 0.4s ease}
.progress-fill-emerald{background:linear-gradient(90deg,#059669,#10B981)}
.progress-fill-amber{background:linear-gradient(90deg,#D97706,#F59E0B)}
.confidence-bar-wrap{display:flex;align-items:center;gap:10px;width:100%}
.confidence-val{font-size:13px;font-weight:700;width:42px;text-align:right}

/* ── Log Console ─── */
.log-console{background:#0F172A;color:#38BDF8;font-family:'JetBrains Mono',monospace;font-size:12px;padding:16px;border-radius:14px;max-height:220px;overflow-y:auto;line-height:1.6;box-shadow:inset 0 2px 10px rgba(0,0,0,0.5)}
.log-line-ok{color:#4ADE80}
.log-line-err{color:#F87171}
.log-line-info{color:#E2E8F0}

/* ── 13-Step Wizard Stepper ─── */
.step-wizard{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;padding:14px;background:rgba(255,255,255,0.6);border-radius:16px;border:1px solid var(--border)}
.step-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--surface3);color:var(--textmuted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;transition:all 0.2s}
.step-num.done{background:var(--emerald);color:#fff}
.step-num.active{background:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-light);animation:pulseRing 1.8s infinite}
.step-num.rejected{background:var(--rose);color:#fff}
.step-label{color:var(--textmuted)}
.step-label.active{color:var(--primary);font-weight:700}
.step-label.done{color:var(--emerald)}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(37,99,235,0.4)}70%{box-shadow:0 0 0 8px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}

/* ── AutoML Job Card ─── */
.job-card{background:var(--surface);border:1px solid rgba(255,255,255,0.8);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(30,41,59,0.05);transition:all 0.2s}
.job-card:hover{box-shadow:0 16px 40px rgba(30,41,59,0.08)}

/* ── Spinner ─── */
.spinner{width:18px;height:18px;border:2.5px solid var(--border-strong);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--textmuted);padding:12px 0}

/* ── Toast ─── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:#0F172A;color:#fff;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,0.3);display:flex;align-items:center;gap:10px;animation:slideUp 0.25s ease}
.toast.success{border-left:4px solid var(--emerald)}
.toast.error{border-left:4px solid var(--rose)}
.toast.info{border-left:4px solid var(--primary)}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* ── Landing page styles ─── */
.landing-hero{padding:60px 20px 40px;text-align:center;max-width:900px;margin:0 auto}
.landing-title{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-bottom:18px;color:var(--text);font-family:'Outfit',sans-serif}
.landing-title span{background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.landing-sub{font-size:17px;color:var(--textmuted);line-height:1.6;max-width:680px;margin:0 auto 36px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1040px;margin:0 auto;padding:0 20px 60px}
.role-card{background:var(--surface);border:1px solid rgba(255,255,255,0.8);border-radius:22px;padding:28px;box-shadow:0 14px 35px rgba(30,41,59,0.06);transition:all 0.25s;display:flex;flex-direction:column;justify-content:space-between}
.role-card:hover{transform:translateY(-5px);box-shadow:0 22px 50px rgba(30,41,59,0.11);border-color:var(--primary)}
.role-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:18px}
.role-title{font-size:20px;font-weight:800;margin-bottom:10px;color:var(--text);font-family:'Outfit',sans-serif}
.role-desc{font-size:13px;color:var(--textmuted);line-height:1.55;margin-bottom:22px;flex-grow:1}
.feature-list{font-size:12px;color:var(--textmuted);margin-bottom:24px;display:flex;flex-direction:column;gap:8px;text-align:left}
.feature-list li{list-style:none;display:flex;align-items:center;gap:8px}
.feature-list li::before{content:'✓';color:var(--emerald);font-weight:800}

/* ── Divider ─── */
.divider{height:1px;background:var(--border-strong);margin:24px 0}
</style>
</head>
<body>

<!-- Header -->
<header>
  <a href="#" class="header-brand" onclick="navigate('home')">
    <div class="header-logo">🏥</div>
    <span class="heading-font">Hospital AI Ecosystem <span class="badge badge-primary" style="font-size:10px;margin-left:4px">v2.1.0</span></span>
  </a>
  <div class="flex items-center gap-3" id="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openAuth('doctor')">🩺 Doctor Access</button>
    <button class="btn btn-primary btn-sm" onclick="openAuth('hospital')">🏢 Hospital Access</button>
  </div>
</header>

<div class="app-container">
  <!-- Sidebar -->
  <aside id="sidebar" class="hidden">
    <div class="sidebar-section" id="sidebar-role-label">NAVIGATION</div>
    <div id="sidebar-nav"></div>
    <div style="margin-top:auto;padding:16px;border-top:1px solid var(--beige-dark)">
      <div class="text-xs text-muted mb-2 font-semibold">LOGGED IN AS</div>
      <div class="font-bold text-sm truncate" id="sidebar-user-name">Guest</div>
      <div class="text-xs mono text-muted truncate mb-3" id="sidebar-user-id">—</div>
      <button class="btn btn-ghost btn-sm w-full" onclick="logout()">🚪 Sign Out</button>
    </div>
  </aside>

  <!-- Main view -->
  <main id="main-content">
    <!-- Rendered dynamically via JS -->
  </main>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Auth Modal -->
<div id="auth-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAuth()">✕</button>
    <div id="auth-modal-body"></div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   GLOBAL STATE & STORAGE
══════════════════════════════════════════════════ */

function stepNumFromStatus(status) {
  const map = {
    UPLOADED:1, PROFILING:2, AWAITING_CONFIG:3, CLEANING:4,
    AWAITING_APPROVAL:5, TRAINING:7, EXPLAINING:8,
    REPORT_READY:12, DEPLOYED:13, FAILED:-1, REJECTED:-1
  };
  return map[status] || 1;
}

   UTILS
══════════════════════════════════════════════════ */
async function apiFetch(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (SESSION.token) headers['Authorization'] = `Bearer ${SESSION.token}`;
  if (SESSION.id)    headers['X-User-ID'] = SESSION.id;
  const r = await fetch(path, { ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || data.message || `Request failed (${r.status})`);
  return data;
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span><div>${msg}</div>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function set(id, html) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

function statusDot(s) {
  const low = (s||'').toLowerCase();
  if (low.includes('active') || low.includes('connected') || low.includes('deployed')) return '<span class="dot-active"></span>';
  if (low.includes('in use') || low.includes('progress') || low.includes('train')) return '<span class="dot-warn"></span>';
  return '<span class="dot-off"></span>';
}

function statusBadge(s) {
  const low = (s||'').toLowerCase();
  const cls = low.includes('active') || low.includes('deployed') ? 'badge-emerald' :
              low.includes('train') || low.includes('cleaning') || low.includes('explain') ? 'badge-primary' :
              low.includes('reject') || low.includes('fail') ? 'badge-rose' :
              low.includes('approv') || low.includes('report') ? 'badge-amber' : 'badge-slate';
  return `<span class="badge ${cls}">${s}</span>`;
}

function progressBar(pct, cls='') {
  return `<div class="progress-bar"><div class="progress-fill ${cls}" style="width:${pct}%"></div></div>`;
}

function confBar(pct) {
  const cls = pct >= 80 ? 'progress-fill-emerald' : pct >= 50 ? '' : 'progress-fill-amber';
  return `<div class="confidence-bar-wrap">${progressBar(pct,cls)}<span class="confidence-val font-bold" style="color:${pct>=80?'var(--emerald)':pct>=50?'var(--primary)':'var(--amber)'}">${pct}%</span></div>`;
}

async function handleLogin(role) {
  const id = document.getElementById('auth-id').value.trim();
  const pass = document.getElementById('auth-pass').value.trim();
  if (!id || !pass) { toast('Please enter credentials.', 'error'); return; }

  try {
    const endpoint = role === 'doctor' ? '/api/doctor/login' : '/api/hospital/login';
    const payload = role === 'doctor' ? { license_no: id, password: pass } : { reg_no: id, password: pass };
    const r = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(payload) });
    if (r.otp_required) { renderOTPStep(r.temp_token, role, id); }
  } catch(e) { toast(e.message, 'error'); }
}

async function handleSignup(role) {
  const name = document.getElementById('sup-name').value.trim();
  const id = document.getElementById('sup-id').value.trim();
  const pass = document.getElementById('sup-pass').value.trim();
  if (!name || !id || !pass) { toast('All fields are required.', 'error'); return; }

  try {
    const endpoint = role === 'doctor' ? '/api/doctor/signup' : '/api/hospital/signup';
    const payload = role === 'doctor' ? { full_name: name, license_no: id, password: pass } : { hospital_name: name, reg_no: id, password: pass };
    const r = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(payload) });
    if (r.otp_required) { renderOTPStep(r.temp_token, role, id); }
  } catch(e) { toast(e.message, 'error'); }
}

function renderOTPStep(tempToken, role, id) {
  set('auth-modal-body', `
    <div class="section-title mb-3">🔐 Two-Factor Authentication (OTP)</div>
    <div class="alert-bar alert-primary mb-4">A temporary one-time password has been generated for your session. In demo mode, enter any 6-digit OTP or <strong class="mono">123456</strong>.</div>
    <div class="form-group"><label>Enter 6-Digit OTP</label><input id="otp-val" class="form-input mono text-center text-lg font-bold" placeholder="123456" maxlength="6" value="123456"></div>
    <button class="btn btn-primary w-full mt-2" onclick="verifyOTP('${tempToken}','${role}')">Verify & Enter Platform →</button>
  `);
}

async function verifyOTP(tempToken, role) {
  const otp = document.getElementById('otp-val').value.trim();
  if (!otp) { toast('Enter OTP.', 'error'); return; }
  try {
    const r = await apiFetch('/api/verify-otp', { method: 'POST', body: JSON.stringify({ temp_token: tempToken, otp }) });
    SESSION = { role, id: r.user_id, token: r.token, full_name: r.full_name || r.hospital_name || r.user_id, hospital_id: 1 };
    localStorage.setItem('hospital_ai_session', JSON.stringify(SESSION));
    closeAuth();
    toast(`Welcome, ${SESSION.full_name}!`, 'success');
    document.getElementById('sidebar').classList.remove('hidden');
    document.getElementById('header-actions').innerHTML = `
      <span class="badge badge-primary">${role.toUpperCase()}</span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>`;
    document.getElementById('sidebar-user-name').textContent = SESSION.full_name;
    document.getElementById('sidebar-user-id').textContent = SESSION.id;
    buildSidebar();
    navigate(role === 'doctor' ? 'doctor-dash' : 'hosp-dash');
  } catch(e) { toast(e.message, 'error'); }
}

async function pollActiveAutoMLJobs() {
  const inTraining = _automlJobs.filter(j => ['TRAINING','CLEANING','PROFILING','EXPLAINING'].includes(j.status));
  if (!inTraining.length) { clearInterval(_automlPollingTimer); _automlPollingTimer = null; return; }

  for (const j of inTraining) {
    try {
      const job = await apiFetch(`/api/hospital/automl/job/${j.id}`);
      // Update local array item
      const idx = _automlJobs.findIndex(item => item.id === job.id);
      if (idx !== -1) _automlJobs[idx] = job;
      
      // If status changed to something waiting or finished, re-render the whole tab list
      if (job.status !== j.status) {
        renderAutoML();
        break;
      } else {
        const card = document.getElementById(`job-card-${j.id}`);
        if (card) card.outerHTML = renderJobCard(job, 'in-training');
      }
    } catch(e) { /* ignore single poll failure */ }
  }
}

async function pollJob(jobId) {
  try {
    const job = await apiFetch(`/api/hospital/automl/job/${jobId}`);
    const idx = _automlJobs.findIndex(item => item.id === jobId);
    if (idx !== -1) _automlJobs[idx] = job;
    const card = document.getElementById(`job-card-${jobId}`);
    if (card) card.outerHTML = renderJobCard(job, 'all');
    toast('Status refreshed.', 'info');
  } catch(e) { toast(e.message, 'error'); }
}

async function submitJobConfig(jobId) {
  const target = document.getElementById(`cfg-target-${jobId}`).value.trim();
  const phiRaw = document.getElementById(`cfg-phi-${jobId}`).value;
  const phi = phiRaw.split(',').map(s => s.trim()).filter(Boolean);
  if (!target) { toast('Target column is required.', 'error'); return; }

  try {
    await apiFetch(`/api/hospital/automl/job/${jobId}/config`, {
      method: 'POST',
      body: JSON.stringify({ target_column: target, phi_columns: phi })

    toast('Step 3 confirmed! Data cleaning & standardisation (Step 4) initiated.', 'success');
    setTimeout(() => { switchAutoMLTab('training'); renderAutoML(); }, 1200);
  } catch(e) { toast(e.message, 'error'); }
}

    const shadow = await apiFetch('/api/hospital/shadow-mode');
    _shadowData = shadow;
    const s = shadow.summary;

    container.innerHTML = `
      <div class="divider"></div>
      <div class="section-title">👻 Step 9–11: Shadow Mode & RLHF Reviewer Queue</div>
      <div class="alert-bar alert-primary mb-4">
        Candidate models run silently in Shadow Mode against incoming hospital cases. Reviewer-role clinicians label predictions (Reinforcement Learning from Human Feedback). Once shadow accuracy meets the threshold gate (≥ <strong>${(s.threshold * 100).toFixed(0)}%</strong> over ≥ <strong>${s.min_sample_size}</strong> cases), models advance to Step 12 Governing Approval.
      </div>

      <div class="grid-4 mb-6">
        <div class="stat-card"><div class="stat-label">Total Predictions</div><div class="stat-val text-primary">${s.total}</div><div class="stat-sub">Shadow evaluations</div></div>
        <div class="stat-card"><div class="stat-label">Reviewed Cases</div><div class="stat-val text-emerald">${s.reviewed}</div><div class="stat-sub">Target: ${s.min_sample_size} required</div></div>
        <div class="stat-card"><div class="stat-label">Shadow Accuracy</div><div class="stat-val ${s.accuracy_on_reviewed >= s.threshold ? 'text-emerald' : 'text-amber'}">${s.accuracy_on_reviewed != null ? (s.accuracy_on_reviewed * 100).toFixed(0) + '%' : '—'}</div><div class="stat-sub">Threshold: ${(s.threshold * 100).toFixed(0)}%</div></div>
        <div class="stat-card"><div class="stat-label">Threshold Gate (Step 11)</div><div class="stat-val ${s.eligible_for_approval ? 'text-emerald' : 'text-rose'}" style="font-size:24px">${s.eligible_for_approval ? '✅ PASSED' : '⏳ PENDING'}</div><div class="stat-sub">${s.eligible_for_approval ? 'Eligible for Step 12' : 'Requires more reviews'}</div></div>
      </div>

      <div class="section-title">🏷️ RLHF Clinical Labeling Queue</div>
      <div id="rlhf-queue">
        ${shadow.predictions.filter(p => !p.reviewed).length === 0 ? `
          <div class="card-beige text-sm text-muted text-center py-6">All shadow predictions have been reviewed. Excellent work!</div>` :
          shadow.predictions.filter(p => !p.reviewed).map(p => `
            <div class="card mb-4 flex justify-between items-center">
              <div>
                <div class="font-bold text-base mb-1">${p.case_token} · <span class="text-primary">${p.model_name}</span></div>
                <div class="text-sm text-text mb-1">AI Shadow Prediction: <strong class="text-emerald">${p.prediction}</strong> · Confidence: ${(p.confidence * 100).toFixed(0)}%</div>
                <div class="text-xs text-muted mono">${p.timestamp}</div>
              </div>
              <div class="flex gap-2">
                <button class="btn btn-success btn-sm" onclick="labelPrediction('${p.id}','Correct',1)">✓ Confirm Correct</button>
                <button class="btn btn-danger btn-sm" onclick="labelPrediction('${p.id}','Incorrect',0)">✗ Flag Incorrect</button>
                <button class="btn btn-ghost btn-sm" onclick="labelPrediction('${p.id}','Uncertain',-1)">? Uncertain</button>
              </div>
            </div>`).join('')}
      </div>
    `;
  } catch(e) { /* non-fatal if shadow panel fails */ }
}

async function labelPrediction(predId, label, score) {
  try {
    await apiFetch('/api/hospital/rlhf/label', {
      method: 'POST',
      body: JSON.stringify({ prediction_id: predId, label, score })
    });
    toast(`Case labeled as "${label}". RLHF weights updated.`, 'success');
    renderShadowPanel();
  } catch(e) { toast(e.message, 'error'); }
}

async function checkVendorScope(vendorId, modelName) {
  const age = parseInt(document.getElementById(`scope-age-${vendorId}`).value || '45', 10);
  const modality = document.getElementById(`scope-mod-${vendorId}`).value.trim() || 'X-Ray';
  const format = document.getElementById(`scope-fmt-${vendorId}`).value.trim() || '.dcm';
  const el = document.getElementById(`scope-res-${vendorId}`);
  el.innerHTML = `<div class="loading-row"><div class="spinner"></div> Checking boundary...</div>`;

  try {
    const r = await apiFetch('/api/marketplace/scope-check', {
      method: 'POST',
      body: JSON.stringify({ vendor_id: vendorId, patient_age: age, modality, input_format: format })
    });
    if (r.allowed) {
      el.innerHTML = `<div class="text-xs text-emerald font-semibold mt-1">✅ Scope Gate PASSED: Authorized for ${modality} (${format}, age ${age}).</div>`;
    } else {
      el.innerHTML = `<div class="text-xs text-rose font-semibold mt-1">❌ Scope Gate BLOCKED: ${r.reason}</div>`;
    }
  } catch(e) { el.innerHTML = `<div class="text-xs text-rose">${e.message}</div>`; }
}
